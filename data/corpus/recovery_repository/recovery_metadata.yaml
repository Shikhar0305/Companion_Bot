# keyword/keyword[]/bool filters in Qdrant. point_id is stable.
# Grounded in the in-repo decision trees + legal repository (see each doc's
# provenance note); not a content source — attach to chunks at load time.
schema_version: 1
collection: cchq_recovery_kb
vector: {size: 1024, distance: Cosine}
payload_index:
