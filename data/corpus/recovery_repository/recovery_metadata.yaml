  - {field: recovery_stage, type: keyword}
  - {field: channels, type: keyword}
  - {field: asset_types, type: keyword}
  - {field: crime_categories, type: keyword}
  - {field: applicable_statutes, type: keyword}
  - {field: escalation_to, type: keyword}
  - {field: time_critical, type: bool}
  - {field: golden_hour, type: bool}
  - {field: cross_border, type: bool}
  - {field: source_grounded, type: bool}
