# Standalone Qdrant for local development / ingestion.
# Usage:
#   docker compose -f infra/docker-compose.qdrant.yml up -d
#   EMBEDDER=bge VECTOR_STORE=qdrant python scripts/ingest_qdrant.py
#   VECTOR_STORE=qdrant uvicorn app.main:app --port 8080
# Data persists in the named volume; REST on 6333, gRPC on 6334.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: companion_qdrant
    ports:
      - "6333:6333"   # REST / dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
