# Local on-prem stack (docs/05 §5.6). LLM is the only optionally-external piece.
services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EMBEDDER=bge
      - VECTOR_STORE=qdrant
      - RERANKER=bge
      - LLM_PROFILE=claude
      - QDRANT_URL=http://qdrant:6333
      - AUTH_ENABLED=true
    env_file:
      - ../.env
    depends_on:
      - qdrant
      - postgres
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=companion_audit
      - POSTGRES_USER=companion
      - POSTGRES_PASSWORD=change_me
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=companion
      - MINIO_ROOT_PASSWORD=change_me
    volumes:
      - minio_data:/data

volumes:
  qdrant_data:
  pg_data:
  minio_data:
